<section class="section-card page-section">
  <h2 class="page-title">Conversione Crypto</h2>
  <p class="page-subtitle">Converti un importo da Euro in criptovalute.</p>

  <div class="field-group">
    <label class="field-label" for="euro">Importo in Euro (€)</label>
    <div class="input-row">
      <input type="number" id="euro" [(ngModel)]="euroAmount" (input)="convert()" placeholder="Inserisci importo">
      <button type="button" class="btn-secondary" (click)="useCurrentBalance()">Usa Saldo</button>
    </div>
  </div>

  <div class="field-group">
    <label class="field-label" for="crypto">Converti in</label>
    <select id="crypto" [(ngModel)]="selectedCrypto" (change)="convert()">
      <option *ngFor="let rate of rates | keyvalue" [value]="rate.key">{{ rate.key }}</option>
    </select>
  </div>

  <div class="result" *ngIf="result !== null">
    <span class="result-label">Risultato</span>
    <span class="result-value">{{ euroAmount | currency:'EUR' }} = {{ result | number:'1.6-6' }} {{ selectedCrypto }}</span>
  </div>
</section>
