<div class="conversion-container">
  <h2>Conversione Crypto</h2>
  <div class="form-group">
    <label for="euro">Importo in Euro (€):</label>
    <input type="number" id="euro" [(ngModel)]="euroAmount" (input)="convert()" placeholder="Inserisci importo">
    <button (click)="useCurrentBalance()">Usa Saldo Attuale</button>
  </div>

  <div class="form-group">
    <label for="crypto">Converti in:</label>
    <select id="crypto" [(ngModel)]="selectedCrypto" (change)="convert()">
      <option *ngFor="let rate of rates | keyvalue" [value]="rate.key">{{ rate.key }}</option>
    </select>
  </div>

  <div class="result" *ngIf="result !== null">
    <h3>Risultato:</h3>
    <p>{{ euroAmount | currency:'EUR' }} = {{ result | number:'1.6-6' }} {{ selectedCrypto }}</p>
  </div>
</div>
