
<section class="section-card page-section">
  <h2 class="page-title">Prelievo</h2>
  <p class="page-subtitle">Esegui un prelievo con controllo del saldo disponibile.</p>

  <div class="field-group">
    <label class="field-label" for="amount">Importo</label>
    <input [(ngModel)]="amount" type="number" id="amount" name="amount" required />
  </div>

  <div class="field-group">
    <label class="field-label" for="descrizione">Descrizione (opzionale)</label>
    <textarea [(ngModel)]="descrizione" id="descrizione" name="descrizione" placeholder="Aggiungi una nota..."></textarea>
  </div>

  <button type="button" class="btn-danger" (click)="prelieva()">Preleva</button>

</section>
